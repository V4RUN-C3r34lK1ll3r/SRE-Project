apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-takehome-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/V4RUN-C3r34lK1ll3r/SRE-Project.git
    targetRevision: main
    path: v2-argocd/chart
    helm:
      parameters:
        # All three filled in from `terraform output` after `apply` -- see
        # README.md. Nothing here is hardcoded: the Key Vault name isn't
        # deterministic (random suffix), the client ID doesn't exist until
        # AKS creates the addon identity, and the tenant ID is left out of
        # the chart so it isn't silently pinned to one specific tenant.
        - name: keyVault.userAssignedIdentityID
          value: REPLACE_WITH_TERRAFORM_OUTPUT_CLIENT_ID
        - name: keyVault.name
          value: REPLACE_WITH_TERRAFORM_OUTPUT_KV_NAME
        - name: keyVault.tenantId
          value: REPLACE_WITH_TERRAFORM_OUTPUT_TENANT_ID
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
