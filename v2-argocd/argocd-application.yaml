apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-takehome-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/V4RUN-C3r34lK1ll3r/SRE-Project.git
    targetRevision: main
    path: v2-argocd/chart
    helm:
      parameters:
        # Both filled in from `terraform output` after `apply` -- see
        # README.md. The Key Vault name isn't deterministic (random
        # suffix), so it can't be hardcoded any more than the client ID.
        - name: keyVault.userAssignedIdentityID
          value: REPLACE_WITH_TERRAFORM_OUTPUT_CLIENT_ID
        - name: keyVault.name
          value: REPLACE_WITH_TERRAFORM_OUTPUT_KV_NAME
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
