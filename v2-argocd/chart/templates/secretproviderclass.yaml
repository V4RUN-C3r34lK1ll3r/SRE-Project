apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: secret-one
          objectType: secret
        - |
          objectName: secret-two
          objectType: secret
  # Mirrors the two Key Vault secrets into a native Kubernetes Secret --
  # this is what lets the Deployment below use an ordinary secretKeyRef
  # instead of reading the CSI-mounted file directly.
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: secret-one
          key: APP_SECRET
        - objectName: secret-two
          key: SIDECAR_SECRET
