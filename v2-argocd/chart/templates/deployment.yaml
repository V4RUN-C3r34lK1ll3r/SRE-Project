apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # Two containers in one pod -- the same shape as v1's container
      # app (web + sidecar), just expressed as a Kubernetes pod spec
      # instead of an azurerm_container_app template block.
      containers:
        - name: web
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_SECRET
            - name: REDIS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_CONNECTION_STRING
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
        - name: sidecar
          image: {{ .Values.image }}
          # Containers in a pod share a network namespace, same as
          # containers in a single Container App revision (see v1). Both
          # containers defaulting to nginx would both try to bind :80 and
          # one would crash-loop -- keep the sidecar as a non-listening
          # placeholder instead.
          command: ["sleep", "infinity"]
          env:
            - name: SIDECAR_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SIDECAR_SECRET
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-kv
