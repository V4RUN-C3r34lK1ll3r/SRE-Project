replicaCount: 1

image: nginx:latest

keyVault:
  # Includes a random 4-character suffix (Key Vault names are globally
  # unique across Azure), so this can't be hardcoded to a fixed value.
  # Comes from `terraform output key_vault_name` in v2-argocd/ -- set here
  # (or via the ArgoCD Application's helm values override) after `apply`.
  name: ""
  # Not hardcoded to one tenant -- comes from `terraform output tenant_id`,
  # same pattern as name and userAssignedIdentityID below. Keeps the chart
  # portable to a different tenant instead of silently pointing at this one.
  tenantId: ""
  # Client ID of the AKS Key Vault Secrets Provider addon's managed identity.
  # Comes from `terraform output key_vault_secrets_provider_client_id` in
  # v2-argocd/ -- set here (or via the ArgoCD Application's helm values
  # override) after the cluster exists, since the identity doesn't exist
  # until AKS creates it.
  userAssignedIdentityID: ""
